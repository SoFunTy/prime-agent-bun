# Fork release pipeline: build the Bun-kernel `prime-agent` on each native
# runner, verify the packaged binary boots, and (on a tag) attach the
# tarballs to a GitHub Release.
#
# The fork's own workflow: upstream's release.yml publishes to the org's R2
# channel and consumes continuous-build artifacts, neither of which exists on
# a personal fork. This one stays self-contained:
#   - `make package` is the same local packaging path the repo documents
#     (release build -> fixture catalog assets -> staged layout -> tarball +
#     SHA256SUMS + binaries.json), so a green run means what `make package`
#     produces here.
#   - The catalog fixture is used on purpose: no network, no catalog-ref, so
#     a release never depends on another repository's availability.
#   - Each target builds natively (no cross-compilation): macos-14 (arm64),
#     macos-13 (x64), and ubuntu-22.04 (x64, the GLIBC 2.35 baseline).
#
# Triggers:
#   - push a `fork-v*` tag -> build every target and publish a GitHub Release
#     (the prefix keeps upstream's tag workflows from firing on the fork)
#   - workflow_dispatch -> build every target; optionally publish by passing
#                          a tag name (leave empty to build artifacts only)
name: fork-release

on:
  push:
    tags:
      - "fork-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (empty = build artifacts only)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package-${{ matrix.label }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: darwin-arm64
            runs-on: macos-14
          - label: darwin-x64
            runs-on: macos-15-intel
          - label: linux-x64
            runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config
      - name: Package
        env:
          COPYFILE_DISABLE: "1"
        run: make package
      - name: Boot the packaged binary
        run: |
          set -euo pipefail
          mkdir -p /tmp/pa-smoke
          tar -xzf target/release-package/*.tar.gz -C /tmp/pa-smoke
          "$(find /tmp/pa-smoke -maxdepth 2 -type f -name prime-agent | head -1)" --version
      - uses: actions/upload-artifact@v4
        with:
          name: prime-agent-${{ matrix.label }}
          path: |
            target/release-package/*.tar.gz
            target/release-package/SHA256SUMS
            target/release-package/binaries.json
          if-no-files-found: error

  release:
    name: publish
    needs: package
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -name '*.tar.gz' -exec cp {} release/ \;
          # Each target's artifact carries its own one-line SHA256SUMS.
          cat dist/*/SHA256SUMS > release/SHA256SUMS
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          files: |
            release/*.tar.gz
            release/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag != '' && inputs.tag || github.ref_name, '-') }}
